[project]
name = "fairness-project"
version = "0.1.0"
description = "Sensitive-attribute leakage in recommender systems (ML-1M Phase A)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "kmeans-pytorch>=0.3",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0.0",
    "recbole>=1.2.0",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.1",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "scienceplots>=2.2.2",
]
